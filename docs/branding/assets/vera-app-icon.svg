<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="v-app-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0D2340" />
      <stop offset="100%" stop-color="#071426" />
    </radialGradient>
    <linearGradient id="v-app-grad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="50%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>
    <linearGradient id="v-app-core" x1="210" y1="160" x2="302" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="100%" stop-color="#176BFF" />
    </linearGradient>
    <filter id="v-app-bloom" x="160" y="120" width="192" height="192" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="512" height="512" rx="112" fill="url(#v-app-bg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#1C3B66" stroke-width="4" />

  <!-- Background Topology Matrix Grid Pattern (Subtle) -->
  <g opacity="0.12" stroke="#54D6FF" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="230" stroke-dasharray="2 6" />
    <line x1="60" y1="256" x2="452" y2="256" />
    <line x1="256" y1="60" x2="256" y2="452" />
  </g>

  <!-- Network Conduction Matrix Lines -->
  <line x1="120" y1="130" x2="195" y2="245" stroke="url(#v-app-grad)" stroke-width="18" stroke-linecap="round" />
  <line x1="392" y1="130" x2="317" y2="245" stroke="url(#v-app-grad)" stroke-width="18" stroke-linecap="round" />
  <line x1="195" y1="245" x2="256" y2="395" stroke="url(#v-app-grad)" stroke-width="18" stroke-linecap="round" />
  <line x1="317" y1="245" x2="256" y2="395" stroke="url(#v-app-grad)" stroke-width="18" stroke-linecap="round" />

  <!-- Internal Nexus Bridge Lines (Intelligence Mesh) -->
  <line x1="195" y1="245" x2="256" y2="206" stroke="#54D6FF" stroke-width="8" stroke-dasharray="10 10" opacity="0.85" />
  <line x1="317" y1="245" x2="256" y2="206" stroke="#54D6FF" stroke-width="8" stroke-dasharray="10 10" opacity="0.85" />
  <line x1="256" y1="206" x2="256" y2="395" stroke="#54D6FF" stroke-width="8" opacity="0.8" />
  <line x1="120" y1="130" x2="256" y2="206" stroke="#176BFF" stroke-width="6" opacity="0.5" />
  <line x1="392" y1="130" x2="256" y2="206" stroke="#176BFF" stroke-width="6" opacity="0.5" />

  <!-- Outer Network Nodes -->
  <circle cx="120" cy="130" r="22" fill="#071426" stroke="#54D6FF" stroke-width="10" />
  <circle cx="392" cy="130" r="22" fill="#071426" stroke="#54D6FF" stroke-width="10" />
  <circle cx="195" cy="245" r="18" fill="#071426" stroke="#176BFF" stroke-width="10" />
  <circle cx="317" cy="245" r="18" fill="#071426" stroke="#176BFF" stroke-width="10" />

  <!-- Apex Gateway Node -->
  <circle cx="256" cy="395" r="26" fill="#071426" stroke="#176BFF" stroke-width="12" />
  <circle cx="256" cy="395" r="10" fill="#54D6FF" />

  <!-- Central Intelligence Nexus Core -->
  <circle cx="256" cy="206" r="42" fill="#071426" stroke="#54D6FF" stroke-width="10" filter="url(#v-app-bloom)" />
  <circle cx="256" cy="206" r="28" fill="url(#v-app-core)" />
  <circle cx="256" cy="206" r="10" fill="#EAF2FF" />
</svg>
