# AIRA OS — Production Nginx Reverse Proxy Configuration
# Target: Customer Self-Service Portal & External Access (Networking VIII / WP 8.9)

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=portal_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portal_api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name portal.aira.lstechnology.net;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.aira.lstechnology.net;

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    ssl_certificate /etc/ssl/certs/aira_portal_fullchain.pem;
    ssl_certificate_key /etc/ssl/private/aira_portal_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Mandatory HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:;" always;

    # Body Size Limits (Prevents memory exhaustion on 8 GB ThinkPad host)
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Gzip Compression for Frontend Assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Throttled Authentication Route
    location /api/v1/portal/auth/login {
        limit_req zone=portal_auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Portal API Reverse Proxy
    location /api/v1/portal/ {
        limit_req zone=portal_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket Proxy for Live Telemetry & Events
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Static Frontend Single Page Application (SPA)
    location / {
        root /var/www/aira/app/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
