  <line x1="124" y1="22" x2="124" y2="88" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Wordmark "VERA" -->
  <text x="145" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#071426" letter-spacing="0.18em">VERA</text>

  <!-- Tagline / Subtitle -->
  <text x="147" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#176BFF" letter-spacing="0.22em">ENTERPRISE NETWORK INTELLIGENCE</text>
