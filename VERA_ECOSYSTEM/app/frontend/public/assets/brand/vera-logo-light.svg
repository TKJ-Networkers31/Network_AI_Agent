<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <!-- Light Surface Background -->
  <rect width="460" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <defs>
    <linearGradient id="v-light-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
  </defs>

  <!-- Left Symbol Group -->
  <g transform="translate(10, 5) scale(0.9)">
    <line x1="24" y1="28" x2="44" y2="58" stroke="url(#v-light-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="96" y1="28" x2="76" y2="58" stroke="url(#v-light-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="44" y1="58" x2="60" y2="96" stroke="url(#v-light-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="76" y1="58" x2="60" y2="96" stroke="url(#v-light-grad)" stroke-width="4.5" stroke-linecap="round" />

    <line x1="44" y1="58" x2="60" y2="48" stroke="#0284C7" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
    <line x1="76" y1="58" x2="60" y2="48" stroke="#0284C7" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
    <line x1="60" y1="48" x2="60" y2="96" stroke="#0284C7" stroke-width="2.2" opacity="0.8" />
    <line x1="24" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />
    <line x1="96" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />

    <circle cx="24" cy="28" r="5.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <circle cx="96" cy="28" r="5.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <circle cx="44" cy="58" r="5" fill="#FFFFFF" stroke="#176BFF" stroke-width="3" />
    <circle cx="76" cy="58" r="5" fill="#FFFFFF" stroke="#176BFF" stroke-width="3" />

    <circle cx="60" cy="96" r="6.5" fill="#FFFFFF" stroke="#176BFF" stroke-width="3.5" />
    <circle cx="60" cy="96" r="2.5" fill="#0284C7" />

    <circle cx="60" cy="48" r="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <circle cx="60" cy="48" r="6.5" fill="#176BFF" />
    <circle cx="60" cy="48" r="2.2" fill="#FFFFFF" />
