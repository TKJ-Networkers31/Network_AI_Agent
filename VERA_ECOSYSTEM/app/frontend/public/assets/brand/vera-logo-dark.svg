<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <!-- Dark Navy Surface Background -->
  <rect width="460" height="110" rx="14" fill="#071426" stroke="#1C3B66" stroke-width="1.5" />

  <defs>
    <linearGradient id="v-dark-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="60%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>
    <linearGradient id="v-dark-glow" x1="45" y1="35" x2="65" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="100%" stop-color="#176BFF" />
    </linearGradient>
    <filter id="v-dark-bloom" x="35" y="25" width="40" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Symbol Group -->
  <g transform="translate(10, 5) scale(0.9)">
    <line x1="24" y1="28" x2="44" y2="58" stroke="url(#v-dark-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="96" y1="28" x2="76" y2="58" stroke="url(#v-dark-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="44" y1="58" x2="60" y2="96" stroke="url(#v-dark-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="76" y1="58" x2="60" y2="96" stroke="url(#v-dark-grad)" stroke-width="4.5" stroke-linecap="round" />

    <line x1="44" y1="58" x2="60" y2="48" stroke="#54D6FF" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
    <line x1="76" y1="58" x2="60" y2="48" stroke="#54D6FF" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
    <line x1="60" y1="48" x2="60" y2="96" stroke="#54D6FF" stroke-width="2.2" opacity="0.8" />
    <line x1="24" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />
    <line x1="96" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />

    <circle cx="24" cy="28" r="5.5" fill="#071426" stroke="#54D6FF" stroke-width="3" />
    <circle cx="96" cy="28" r="5.5" fill="#071426" stroke="#54D6FF" stroke-width="3" />
    <circle cx="44" cy="58" r="5" fill="#071426" stroke="#176BFF" stroke-width="3" />
    <circle cx="76" cy="58" r="5" fill="#071426" stroke="#176BFF" stroke-width="3" />

    <circle cx="60" cy="96" r="6.5" fill="#071426" stroke="#176BFF" stroke-width="3.5" />
    <circle cx="60" cy="96" r="2.5" fill="#54D6FF" />

    <circle cx="60" cy="48" r="10" fill="#071426" stroke="#54D6FF" stroke-width="2.5" filter="url(#v-dark-bloom)" />
    <circle cx="60" cy="48" r="6.5" fill="url(#v-dark-glow)" />
    <circle cx="60" cy="48" r="2.2" fill="#EAF2FF" />
  </g>

  <!-- Divider Line -->
  <line x1="124" y1="22" x2="124" y2="88" stroke="#1C3B66" stroke-width="1.5" />

  <!-- Wordmark "VERA" -->
  <text x="145" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#EAF2FF" letter-spacing="0.18em">VERA</text>

  <!-- Tagline / Subtitle -->
  <text x="147" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#54D6FF" letter-spacing="0.22em">ENTERPRISE NETWORK INTELLIGENCE</text>
</svg>
