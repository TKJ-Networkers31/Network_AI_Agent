<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vera-v-grad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="50%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>
    <linearGradient id="vera-core-glow" x1="50" y1="38" x2="70" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54D6FF" />
      <stop offset="100%" stop-color="#176BFF" />
    </linearGradient>
    <filter id="core-bloom" x="35" y="23" width="50" height="50" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Network Conduction Matrix Lines -->
  <line x1="24" y1="28" x2="44" y2="58" stroke="url(#vera-v-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="96" y1="28" x2="76" y2="58" stroke="url(#vera-v-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="44" y1="58" x2="60" y2="96" stroke="url(#vera-v-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="76" y1="58" x2="60" y2="96" stroke="url(#vera-v-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Internal Nexus Bridge Lines (Intelligence Mesh) -->
  <line x1="44" y1="58" x2="60" y2="48" stroke="#54D6FF" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
  <line x1="76" y1="58" x2="60" y2="48" stroke="#54D6FF" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.85" />
  <line x1="60" y1="48" x2="60" y2="96" stroke="#54D6FF" stroke-width="2.2" opacity="0.8" />
  <line x1="24" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />
  <line x1="96" y1="28" x2="60" y2="48" stroke="#176BFF" stroke-width="1.8" opacity="0.5" />

  <!-- Outer Network Nodes -->
  <circle cx="24" cy="28" r="5.5" fill="#071426" stroke="#54D6FF" stroke-width="3" />
  <circle cx="96" cy="28" r="5.5" fill="#071426" stroke="#54D6FF" stroke-width="3" />
  <circle cx="44" cy="58" r="5" fill="#071426" stroke="#176BFF" stroke-width="3" />
  <circle cx="76" cy="58" r="5" fill="#071426" stroke="#176BFF" stroke-width="3" />

  <!-- Apex Gateway Node -->
  <circle cx="60" cy="96" r="6.5" fill="#071426" stroke="#176BFF" stroke-width="3.5" />
  <circle cx="60" cy="96" r="2.5" fill="#54D6FF" />

  <!-- Central Intelligence Nexus Core -->
  <circle cx="60" cy="48" r="10" fill="#071426" stroke="#54D6FF" stroke-width="2.5" filter="url(#core-bloom)" />
  <circle cx="60" cy="48" r="6.5" fill="url(#vera-core-glow)" />
  <circle cx="60" cy="48" r="2.2" fill="#EAF2FF" />
</svg>
