version: "3.8"

services:
  vera-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: vera-platform:latest
    container_name: vera-platform
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - VERA_ENV=production
      - AIRA_ENV=production
      - VERA_HOST=0.0.0.0
      - VERA_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - vera_db:/app/VERA_ECOSYSTEM/database
      - vera_workspace:/app/workspace
      - vera_logs:/app/VERA_ECOSYSTEM/logs
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  vera_db:
    name: vera_platform_database
  vera_workspace:
    name: vera_platform_workspace
  vera_logs:
    name: vera_platform_logs
