version: "3.8"

services:
  aira-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: aira-os:latest
    container_name: aira-os
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - AIRA_ENV=production
      - AIRA_HOST=0.0.0.0
      - AIRA_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - aira_db:/app/AIRA_ECOSYSTEM/database
      - aira_workspace:/app/workspace
      - aira_logs:/app/AIRA_ECOSYSTEM/logs
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  aira_db:
    name: aira_os_database
  aira_workspace:
    name: aira_os_workspace
  aira_logs:
    name: aira_os_logs
